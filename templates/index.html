<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Watermelon Classifier</title>
</head>
<body>
  <h1>Watermelon Classifier</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*">
    <input type="submit" value="Upload and Predict">
  </form>
  {% if result %}
    <h2>Result: {{ result }}</h2>
    <div>
      <p>Original:</p>
      <img src="{{ url_for('uploaded_file', filename=filename) }}" style="max-width:300px;">
    </div>
    <div>
      <p>Annotated:</p>
      <img src="{{ url_for('uploaded_file', filename=result_image) }}" style="max-width:300px;">
    </div>
  {% endif %}
</body>
</html>
